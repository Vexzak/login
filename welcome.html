<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Welcome!</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f4ff;
    --surface: #ffffff;
    --border: #d0d9f0;
    --accent: #2563eb;
    --accent-light: #eff4ff;
    --text: #1a1f36;
    --muted: #8492b4;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(37,99,235,0.1) 0%, transparent 65%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    animation: pulse 4s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    50%       { transform: translate(-50%, -50%) scale(1.15); opacity: 0.7; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 3.5rem 3rem;
    width: 100%; max-width: 480px;
    text-align: center;
    position: relative;
    box-shadow: 0 8px 40px rgba(37,99,235,0.1);
    animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }

  .dots {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    border-radius: 24px;
    overflow: hidden;
    pointer-events: none;
  }
  .dot {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: fall 1.2s ease forwards;
  }
  @keyframes fall {
    0%   { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(120px) rotate(360deg); }
  }

  .icon {
    width: 80px; height: 80px;
    background: var(--accent-light);
    border: 2px solid rgba(37,99,235,0.25);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.8rem;
    font-size: 2.2rem;
    animation: bounceIn 0.7s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes bounceIn {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }

  .tag {
    display: inline-block;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 100px;
    border: 1px solid rgba(37,99,235,0.2);
    margin-bottom: 1.2rem;
    animation: fadeUp 0.5s 0.4s ease both;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2.4rem;
    line-height: 1.15;
    margin-bottom: 0.8rem;
    color: var(--text);
    animation: fadeUp 0.5s 0.5s ease both;
  }
  h1 em { color: var(--accent); font-style: italic; }

  .username {
    display: block;
    color: var(--accent);
    font-family: 'DM Serif Display', serif;
    font-style: italic;
  }

  p {
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 2.2rem;
    animation: fadeUp 0.5s 0.6s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .actions {
    display: flex;
    gap: 12px;
    animation: fadeUp 0.5s 0.7s ease both;
  }

  .btn {
    flex: 1;
    padding: 13px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: transform 0.15s, box-shadow 0.15s;
    text-decoration: none;
    display: inline-block;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 12px rgba(37,99,235,0.3);
  }
  .btn-primary:hover { box-shadow: 0 6px 16px rgba(37,99,235,0.35); }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: #a0aec0; }

  .divider { width: 40px; height: 2px; background: var(--accent); margin: 1.5rem auto; opacity: 0.2; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="dots" id="dots"></div>

  <div class="icon">🎉</div>
  <div class="tag" id="tagLabel">Account Created</div>

  <h1>Congrats,<br><em><span class="username" id="displayName">friend</span></em></h1>
  <div class="divider"></div>
  <p id="subText">You're all set! Your account is secure and ready to go. Welcome aboard.</p>

  <div class="actions">
    <a href="#" class="btn btn-primary">Go to Dashboard</a>
    <a href="login.html" class="btn btn-ghost" id="logoutBtn">Sign Out</a>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  const mode = params.get('mode');

  if (name) {
    document.getElementById('displayName').textContent = name;
  }

  if (mode === 'login') {
    document.getElementById('tagLabel').textContent = 'Signed In';
    document.getElementById('subText').textContent = "You're back! Great to see you again. Everything is right where you left it.";
    document.querySelector('h1').innerHTML = `Welcome back,<br><em><span class="username">${name || 'friend'}</span></em>`;
  }

  // Confetti burst — blue theme colors
  const colors = ['#2563eb', '#60a5fa', '#3b82f6', '#93c5fd', '#1d4ed8'];
  const dots = document.getElementById('dots');
  for (let i = 0; i < 24; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    const size = Math.random() * 10 + 5;
    dot.style.cssText = `
      width: ${size}px; height: ${size}px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 40}%;
      animation-delay: ${Math.random() * 0.8}s;
      animation-duration: ${1 + Math.random() * 0.8}s;
    `;
    dots.appendChild(dot);
  }

  document.getElementById('logoutBtn').addEventListener('click', async (e) => {
    e.preventDefault();
    await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
